name: Release APK

# Push a tag like v0.2.0 (or run manually with a tag name) to build the signed
# release APK and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0); created on the current commit if missing'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build release
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Name the APK
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION in app/build.gradle.kts"; exit 1
          fi
          OUT="CarRadio-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Signed release APK (sideload key). Installs over earlier versions.

          SHA-256: \`${{ steps.apk.outputs.sha }}\`"
          if gh release view "${{ steps.apk.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" --clobber
          else
            gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
              --target "${{ github.sha }}" --title "Car Radio ${{ steps.apk.outputs.tag }}" \
              --notes "$NOTES" --generate-notes
          fi
